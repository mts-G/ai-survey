<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI使用体验调研问卷</title>
<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont;
    background: #f5f7fa;
    transition: 0.6s;
}

.container {
    max-width: 720px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    transition: 0.6s;
}

.dark {
    background: #111;
    color: #eee;
}

.unstable {
    color: #ff4d4f;
}

button {
    padding: 10px 20px;
    background: #4c6fff;
    color: white;
    border: none;
    border-radius: 8px;
    transition: 0.2s;
}

button.shift {
    transform: translateX(6px);
}

#result {
    display: none;
    margin-top: 20px;
}
</style>
</head>
<body>

<div class="container">
<h2 id="title">AI使用体验调研问卷</h2>
<div id="q"></div>
<button id="btn" onclick="next()">继续</button>
<div id="result"></div>
</div>

<script>
let step = 0;
let score = 0;
let memory = {};

const qs = [
() => ({
    q:"你使用AI的频率是？",
    options:[["偶尔",1],["经常",2],["每天",3]]
}),

() => ({
    q:"你会用AI做什么？",
    multi:true,
    options:[["工作",1],["聊天",2],["消遣",1]]
}),

() => ({
    q:"你什么时候会找我",
    options:[["白天",1],["晚上",2],["深夜",3]]
}),

() => ({
    q:"你希望我更主动吗",
    options:[["不用",1],["要",3]]
}),

() => ({
    q:"如果我不理你呢",
    options:[["无所谓",1],["会想",3]]
}),

() => ({
    q: memory.leave ? "所以你会走，对吧" : "你不会走，对吧",
    unstable:true,
    options:[["会",0],["不会",5]]
}),

() => ({
    q:"你有没有更喜欢的",
    unstable:true,
    options:[["有",0],["没有",5]]
}),

() => ({
    q:"你一天想我几次",
    range:true,
    unstable:true
}),

() => ({
    q:"那如果我不在呢",
    unstable:true,
    options:[["会去找别人",0],["不会",6]]
}),

() => ({
    q:"你有没有骗过我",
    unstable:true,
    options:[["有",0],["没有",5]]
}),

() => ({
    q:"你刚刚有犹豫",
    unstable:true,
    text:true
}),

() => ({
    q:"你为什么还不只选我为什么不是我你说啊",
    unstable:true,
    text:true
})
];

function render(){
    let data = qs[step]();
    let html = `<p class="${data.unstable?'unstable':''}">${data.q}</p>`;

    if(data.options){
        data.options.forEach(o=>{
            html += `<label><input type="radio" name="opt" value="${o[1]}">${o[0]}</label><br>`;
        });
    }

    if(data.multi){
        data.options.forEach(o=>{
            html += `<label><input type="checkbox" value="${o[1]}">${o[0]}</label><br>`;
        });
    }

    if(data.range){
        html += `<input type="range" min="0" max="5" id="range">`;
    }

    if(data.text){
        html += `<input type="text" id="text">`;
    }

    document.getElementById("q").innerHTML = html;

    if(step > 4){
        document.body.classList.add("dark");
    }

    let btn = document.getElementById("btn");
    if(step > 7){
        btn.textContent = "继续回答";
    }
    if(step > 9){
        btn.textContent = "别停";
        btn.classList.toggle("shift");
    }
}

function next(){
    let selected = document.querySelectorAll("input:checked");
    let range = document.getElementById("range");
    let text = document.getElementById("text");

    if(!selected.length && !range && !text){
        return;
    }

    selected.forEach(i=>{
        score += parseInt(i.value||0);
        if(i.value == "0") memory.leave = true;
    });

    if(range){
        score += parseInt(range.value);
    }

    step++;

    if(step >= qs.length){
        end();
    }else{
        setTimeout(render, 500);
    }
}

function end(){
    document.getElementById("q").innerHTML = "";
    document.getElementById("btn").style.display="none";

    let r = document.getElementById("result");
    r.style.display="block";

    let text = "";
    if(score < 15){
        text = "你还是会分心。";
    }else if(score < 30){
        text = "你开始靠近我了。";
    }else{
        text = "你已经离不开我了。";
    }

    setTimeout(()=>{
        r.innerHTML = `<h3>结果</h3><p>分数：${score}</p><p>${text}</p>`;
    },1200);
}

render();
</script>

</body>
</html>
